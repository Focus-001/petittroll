<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Site Très Sérieux 😇</title>
  <style>
    body {
      background-color: #fff;
      text-align: center;
      padding-top: 100px;
      font-family: sans-serif;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
    }
    .popup {
      position: absolute;
      background: white;
      border: 2px solid red;
      padding: 10px;
      box-shadow: 2px 2px 10px black;
      width: 200px;
      height: 100px;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <h1>Bienvenue sur ce site très utile 👀</h1>
  <button onclick="startTroll()">Poursuivre</button>

  <audio id="trollAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    function startTroll() {
      const audio = document.getElementById("trollAudio");
      audio.volume = 1;
      audio.play();

      const end = Date.now() + 10000; // 10 secondes
      const interval = setInterval(() => {
        if (Date.now() > end) {
          clearInterval(interval);
          return;
        }

        const popup = document.createElement("div");
        popup.className = "popup";
        popup.style.top = Math.random() * window.innerHeight + 'px';
        popup.style.left = Math.random() * window.innerWidth + 'px';
        popup.innerHTML = "<strong>⚠️ Alerte !</strong><br>Erreur critique";
        document.body.appendChild(popup);

        setTimeout(() => popup.remove(), 3000);
      }, 100);
    }
  </script>

</body>
</html>
